<!-- 첫 화면 픽셀 글꼴 미리 받기: 첫 화면이 쓰는 Galmuri 부분집합 넷(본문 9 · 버튼 11 · 굵은 11 · 메타 7)을 스타일시트를 다 읽기 전에 받기 시작한다.
     스크립트로 넣는 까닭: file:// 에서는 crossorigin preload 가 CORS 로 막혀 오류·경고가 나고, 시스템 글꼴을 골랐으면 건너뛴다 (쓰지 않게 되면 "preload 했는데 안 씀" 경고가 난다).
     crossorigin 이 없으면 @font-face 요청이 preload 를 다시 쓰지 않고 또 받는다. 스타일시트보다 앞에 있어야 기다리지 않고 바로 돈다 -->
<script>(function () {
  if (!/^https?:$/.test(location.protocol)) return;
  /* 기록 전체를 JSON.parse 하지 않고 글자만 찾는다 (오래 논 기록은 몇 MB — head 에서 파서를 붙잡지 않게). 저장은 JSON.stringify 그대로라 공백이 없고, 문자열 속 따옴표는 \" 라 키로만 걸린다 */
  try { var raw = localStorage.getItem('ppolppol_v2') || ''; if (raw.indexOf('"pixelFont":false') !== -1 || raw.indexOf('"font":"system"') !== -1) return; } catch (e) { /* 저장소 없음 → 기본(픽셀 글꼴) */ }
  ['Galmuri9', 'Galmuri11', 'Galmuri11-Bold', 'Galmuri7'].forEach(function (f) {
    var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = 'vendor/fonts/' + f + '.sub.woff2';
    document.head.appendChild(l);
  });
})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/fonts/galmuri.css"><!-- 픽셀 글꼴 (Galmuri, OFL) · file:// 상대 경로 -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ui-art.css">
<link rel="stylesheet" href="css/runner.css">
<link rel="stylesheet" href="css/intro.css"><!-- 입장 레이어 (js/intro.js) -->
<script src="js/intro.js"></script><!-- head 에서 읽어 html.intro-on 을 먼저 붙인다 (UI 깜빡임 방지) -->
<!-- 저장소 워밍업: 문서가 열리자마자 한 번 읽어 둔다. file:// 원점에서 새로고침 직후 첫 읽기가 직전 커밋을 놓치는 경우가 있어서 (R2) -->
<script>try { localStorage.getItem('ppolppol_v2'); } catch (e) { /* 저장소 없음: app.js 가 메모리로 대신한다 */ }</script>
</head>

              <circle cx="31" cy="43" r="1"/><circle cx="37" cy="42" r="1"/><circle cx="5" cy="38" r=".9"/><circle cx="43" cy="38" r=".9"/>
            </g>
          </g>
          <g class="body">

            <ellipse cx="18" cy="13" rx="5" ry="3.4" fill="#f2a05a" transform="rotate(-25 18 13)"/>
            <circle cx="15.5" cy="11" r="1.4" fill="#fff6ee"/>

            <circle class="pupil" cx="19.6" cy="22.4" r="2" fill="#1b1f2e"/><circle class="pupil" cx="29.6" cy="22.4" r="2" fill="#1b1f2e"/>

      <div id="oct-bubble" hidden></div>

  </div>
  <!-- 장면 오른쪽 위 아이콘 묶음 (DESIGN §7.2 · §6.3): 추억 앨범(첫 포스터·메모가 생긴 뒤부터) · ⚙ 설정. 소리 켜기·끄기는 설정 › 소리 칸 맨 위 (주인 11-08 — 장면 위 스피커는 없앴다).
       누르는 곳 44×44 · 보이는 상자 28×28 · 그림은 12칸 격자 ×2 (currentColor, 두 테마). 앨범 점은 지난번에 앨범을 연 뒤 새 포스터가 붙었을 때만 (숫자 없음, 열면 사라진다) -->
  <div id="scene-ctl" class="scene-ctl">
    <button type="button" id="btn-album" class="icon-btn album-btn" aria-label="추억 앨범" title="추억 앨범" aria-haspopup="dialog" aria-controls="album-sheet" aria-describedby="album-new" hidden>
      <span class="snd-box" aria-hidden="true"><svg viewBox="0 0 12 12" width="24" height="24" shape-rendering="crispEdges" fill="currentColor" focusable="false"><path d="M1 2h10v1H1zM1 10h10v1H1zM1 3h1v7H1zM10 3h1v7h-1z"/><path class="al-pic" d="M3 6h1v1H3zM2 7h3v1H2zM6 5h1v1H6zM5 6h3v1H5zM4 7h5v1H4zM2 8h8v2H2zM8 4h1v1H8z"/></svg></span>
      <span class="ib-dot" aria-hidden="true" hidden></span>
      <span id="album-new" class="sr-only"></span>
    </button>
    <!-- ⚙ 설정 (문어 색 · 소리 켜기·크기 · 모션 · 글꼴 · 기록): 예전 '방 보기' 자리 (주인 11-07: 방 보기는 없앴다) -->
    <button type="button" id="btn-settings" class="icon-btn settings-btn" aria-label="설정" title="설정" aria-haspopup="dialog" aria-controls="settings-sheet">
      <span class="snd-box" aria-hidden="true"><svg viewBox="0 0 12 12" width="24" height="24" shape-rendering="crispEdges" fill="currentColor" focusable="false"><path d="M5 1h2v1H5zM2 2h2v1H2zM5 2h2v1H5zM8 2h2v1H8zM2 3h8v1H2zM3 4h2v1H3zM7 4h2v1H7zM1 5h3v1H1zM8 5h3v1H8zM1 6h3v1H1zM8 6h3v1H8zM3 7h2v1H3zM7 7h2v1H7zM2 8h8v1H2zM2 9h2v1H2zM5 9h2v1H5zM8 9h2v1H8zM5 10h2v1H5z"/></svg></span>
    </button>
  </div>
  <!-- 방 문 · 오락기 (8물결): 3D 장면 위에 겹친 진짜 <button> — 자리 · 크기 · hidden 은 장면이 매 프레임 맞춘다 (scene.hotspots, 누르는 곳 44×44 이상). #scene3d(aria-hidden) 밖에 둔다.
       #btn-door = 다락 안 놀이방 문 (data-spot="over" 일 땐 투명 · 문어가 나가 바깥이 보이는 동안은 data-spot="edge" 로 장면 오른쪽 아래 픽셀 집 단추 — 그림은 16×16 ×2 'ctl.home' (빨간 지붕 집, 주인 11-08), 안 오면 글자 '집').
       누르면 끼익 → 놀이방 (APP.goRoom('play')). #btn-play-door = 놀이방 왼쪽 벽 문 → 문어 방 (goRoom('attic')) · #btn-machine = 다락방 달리기 오락기 → 달리기 창.
       그림 위('over')에선 pointer-events: none — 손가락은 장면이 받아 그린 순서대로 단추를 누른다 (밀기 · 핀치가 문 위에서도 된다). 두 문 단추는 aria-describedby 로 지금 장소 설명(#scene-desc)을 읽힌다 (방을 옮기면 도착한 곳이 들린다) -->
  <button type="button" id="btn-door" class="scene-door" aria-label="놀이방" title="놀이방" aria-describedby="scene-desc">
    <span class="door-box" aria-hidden="true"><img class="door-ico" data-icon="ctl/home" alt="" width="32" height="32" draggable="false"><span class="door-txt">집</span></span>
  </button>
  <button type="button" id="btn-play-door" class="scene-spot" aria-label="문어 방" title="문어 방" aria-describedby="scene-desc" hidden></button>
  <button type="button" id="btn-machine" class="scene-spot" aria-label="다락방 달리기" title="다락방 달리기" aria-haspopup="dialog" hidden></button>
  <!-- 구석 쪽지 (8물결): 놀이방에 있는 동안 문어가 돌아오면 "뚜루가 돌아왔어." + 보러 가기 (놀이방 문으로 다락에). 장면 아래 왼쪽 · 놀이방을 나가면 사라진다 -->
  <div id="back-note" class="back-note" hidden>
    <p id="back-note-txt" class="bn-txt" role="status" aria-live="polite"></p>
    <button type="button" id="btn-back-see" class="btn sm pressable bn-go">보러 가기</button>
  </div>
</section>

<!-- ══ STATUS (§7.2) — 한 줄: 이름 [데모] · 방 제목 | 등불 ■■□□□□□□ n/8.
     [데모] 를 누르면 누가 고르는지 한 줄, 등불을 누르면 "초대한 날마다 한 칸 켜져" — 같은 작은 말풍선(#tip, 2.5 s · 다시 누르면 닫힘 · 화면 낭독기 polite).
     추억 앨범 · 설정 버튼은 장면 오른쪽 위 묶음(#scene-ctl): 320 px 에서 아이콘을 이 줄에 두면 두 글자 이름부터 잘렸다 (DESIGN §7.2) ══ -->
<div id="status">
  <div class="srow">
    <!-- #brain-tag: 데모 두뇌(규칙)가 고르는 동안 늘 보이는 아주 작은 표시 (정직 표기). 모델(MCP) 여행을 재생하는 동안만 숨긴다 (app.js renderBrainTag) -->
    <span class="who"><span id="oct-name" class="name">이름 없는 문어</span><button type="button" id="brain-tag" class="brain-tag"><span aria-hidden="true">데모</span><span class="sr-only">데모 규칙이 움직이는 중</span></button><span id="room-title" class="room-title">불씨 하나 켜진 다락</span></span>
    <button type="button" id="pips" class="pips" aria-label="등불 0/8"><span class="pips-lbl" aria-hidden="true">등불</span><span class="pip-row" aria-hidden="true"></span><span class="pips-n" aria-hidden="true">0/8</span></button>
  </div>
  <p id="tip" class="tip" role="status" aria-live="polite"></p>
</div>

<!-- ══ INVITE (§7.3) ══ -->
<section id="invite" aria-label="초대">
  <!-- 힌트 칸은 개발용 (주인 결정 18, docs/NIGHT_LOG.md): 플레이어 화면에선 버튼 줄만. ?dev=1 · localhost · file:// 에서만 app.js 가 보인다 (DEV).
       hidden 으로 시작해 플레이어에겐 깜빡임·자리 비움이 없다. 두뇌의 힌트 이해는 그대로 (개발·테스트·MCP 이벤트가 쓴다) -->
  <div id="hint-box" class="hint-box" hidden>
    <label class="lbl" for="hint-in">힌트 <span class="dim">(선택 · 개발용)</span></label>
    <input id="hint-in" type="text" maxlength="120" autocomplete="off" enterkeyhint="send"
           placeholder="주제나 링크를 슬쩍 건네줘">
    <div id="hint-help" class="help">비워 두면 힌트 없이 나가</div>
  </div>
  <!-- 큰 버튼 하나 (주인 11-07): 나가 있는 동안엔 "다녀오는 중…" (글자만, 기호 없음) — 누르면 바로 데려온다 (예전 건너뛰기). 따로 된 건너뛰기·방 보기 버튼은 없다 -->
  <div class="btn-row">
    <button type="button" class="btn primary pressable" id="btn-go"><span class="go-txt">뽈뽈 다녀와</span></button>
  </div>
</section>

<!-- ══ 이름 모달 (§7.8) ══ -->

<!-- ══ 포스터 열람 모달 (§6.3 · §15.1) — 왼쪽(폰에선 위) 포스터, 오른쪽(아래) 짧은 기록, 일기(뒷면)는 아래로 펼침 ══ -->

  <h2 id="pd-h" class="sr-only dlg-top" tabindex="-1">포스터</h2><!-- 열 때 포커스는 여기(맨 위) — 첫 버튼은 폰에서 상자 아래쪽이라 (app.js showDialog). 글자는 포스터 제목 -->
  <div class="flipper" id="flipper">
    <div class="inspect">
      <div class="inspect-art"><div class="face front" id="pd-front"></div></div>
      <div class="inspect-text" id="pd-text"></div>
    </div>
    <div class="face back" id="pd-back"></div>
  </div>
  <div class="btn-row center">
    <button type="button" class="btn pressable" id="pd-flip" aria-controls="pd-back" aria-expanded="false">일기 전체 보기</button>
    <button type="button" class="btn pressable" id="pd-save">이미지로 저장</button>
    <button type="button" class="btn pressable" id="pd-copy">복사</button>
    <button type="button" class="btn pressable" id="pd-close">닫기</button>
  </div>
</dialog>

<!-- ══ 설정 (⚙, 장면 오른쪽 위) — 문어 색 · 소리(켜기 · 음악 · 효과음 — js/audio.js 가 채운다) · 모션 · 픽셀 글꼴 · 포스터 썸네일 · 기록 · 누가 고르나. 예전 '방 보기' 시트는 없앴다 (주인 11-07) ══ -->
<dialog id="settings-sheet" class="sheet settings-sheet" aria-labelledby="set-h">
  <div class="handle" aria-hidden="true"></div>
  <h2 id="set-h" class="set-h dlg-top" tabindex="-1">설정</h2><!-- 열 때 포커스는 여기 (app.js showDialog) -->
  <div id="set-body"></div>
  <button type="button" class="btn wide pressable" id="set-close">닫기</button>
</dialog>

<!-- ══ 추억 앨범 (§6.3) — 장면 오른쪽 위 앨범 버튼(#btn-album)으로 여는 시트. 폰은 바텀시트, ≥600px 은 가운데. 카드를 누르면 포스터 열람 창이 그 위에 열린다.
     맨 위 '문어의 요즘' 한두 줄 · 카드 · '남긴 메모'(호기심 메모 전부, 다음 산책에 같이 가는 최근 3개엔 표시 — docs/CURIOSITY_NOTES.md) · '일기' 칩 = 지난 날 로그 (오늘은 아래 '오늘의 산책') ══ -->
<dialog id="album-sheet" class="sheet album-sheet" aria-labelledby="al-h">
  <div class="handle" aria-hidden="true"></div>
  <div class="sec-row al-top">
    <h2 id="al-h" class="al-h dlg-top" tabindex="-1">추억 앨범</h2><!-- 열 때 포커스는 여기 (app.js showDialog) -->
    <div class="filters" role="group" aria-label="앨범 필터">
      <button type="button" class="fchip on" data-f="all" aria-pressed="true">전체</button>
      <button type="button" class="fchip" data-f="poster" aria-pressed="false">포스터</button>
      <button type="button" class="fchip" data-f="note" aria-pressed="false">쪽지</button>
      <button type="button" class="fchip" data-f="diary" aria-pressed="false">일기</button>
    </div>
  </div>
  <div id="al-recent" class="al-recent"></div>
  <div id="album"></div>
  <div id="album-notes"></div>
  <div id="album-diary" class="album-diary" hidden></div>
  <button type="button" class="btn wide pressable" id="al-close">닫기</button>
</dialog>

<!-- 토스트는 이거 하나. 한 번에 하나, 2.5초. 모달이 열려 있으면 app.js 가 그 안으로 옮겨 popover 로 띄운다 (모달 밖은 inert 라 안 보이고 안 읽힌다) -->
<output id="toast" popover="manual" aria-live="polite"></output>

<script src="js/app.js"></script>
