<!doctype html>
<html lang="ko" data-font="pixel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#d7b594" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141f" media="(prefers-color-scheme: dark)">
<title>부엌</title>
<!-- Kitchen prototype, wave 9 slice 1 (docs/COOK_PROTO.md). It opens the kitchen at load; closing it leaves one
     button that opens it again. Its own save key: ppolppol_cook_v0.
     Sound: js/audio.js (the game's own, same origin, so it follows the saved sound setting: off unless the player
     turned it on). ?sound=1 turns it on for this page only (never saved: the game's own setting stays as it was); it
     still starts only on the first touch or key. The kitchen sounds live in foley/ (credits: credits.html).
     Reaction stickers: css/cook-stickers.css + js/cook-stickers.js, after js/cook.js (docs/COOK_STICKERS.md). Pictures
     only. js/cook.js hands them its cooking moments itself (no COOK_STICKERS.listenAudio() here: both would show every
     sticker twice), so they need no sound; without the two files the kitchen plays just the same. -->
<link rel="stylesheet" href="vendor/fonts/galmuri.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cook.css">
<link rel="stylesheet" href="css/cook-stickers.css">
<style>
/* cook.html only: one quiet text link to the credits (the kitchen sounds are recordings by other people).
   Shown on the counter screen, in the empty strip where the verb button sits during a step, and on the closed
   page under the door button. Never during a step or the plate reveal. */
.ckh-credits { display: none; }
.ck-dlg.ck-counter > .ckh-credits, .ck-home > .ckh-credits {
  display: block; position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); padding: 10px 12px; margin: 0;
  font-family: var(--f-meta, 'Galmuri7', sans-serif); font-size: 16px; line-height: 24px; white-space: nowrap;
  color: var(--muted, #602c2c); text-decoration: underline; text-underline-offset: 4px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
/* 11-15 ?embed=1: the game opens this page in a full-screen frame from the play-room counter. No door, no credits
   link (the game's settings have it), nothing behind the kitchen but the kitchen wall colour */
html.ck-embed .ck-home { display: none; }
html.ck-embed .ckh-credits { display: none !important; }
html.ck-embed, html.ck-embed body { background: var(--bg, #d7b594); }
.ckh-credits:focus { outline: none; }
.ckh-credits:focus-visible { outline: 2px solid var(--fg, #341c27); outline-offset: -2px; }
</style>
</head>
<body class="ck-page">
<main class="ck-home">
  <button type="button" id="ck-door" class="ck-door" aria-haspopup="dialog">부엌</button>
  <a class="ckh-credits" href="credits.html?from=cook">만든 것들</a>
</main>
<script src="js/haptics.js"></script>
<script src="js/cook-art.js"></script>
<script src="js/cook.js"></script>
<script src="js/cook-stickers.js"></script>
<script>
(function () {
  'use strict';
  var door = document.getElementById('ck-door'), q = null;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  function get(k) { return q ? q.get(k) : null; }
  /* ?reduced=1 reaches the kitchen as an option (opts below). The reaction stickers only look at the page's motion
     switch, so it is set here too (the main game sets data-motion from its own setting) */
  if (get('reduced') === '1') document.documentElement.setAttribute('data-motion', 'reduce');
  /* 11-15 ?embed=1: inside the game (index.html #cook-overlay). Closing the kitchen (its close button, Esc, back)
     tells the game, which closes the frame; the game says 'open' to open it again and 'close' when it closed the
     frame itself. Messages only to and from the parent window */
  var embed = get('embed') === '1' && window.parent && window.parent !== window;
  if (embed) document.documentElement.classList.add('ck-embed');
  function tell(what) { try { window.parent.postMessage({ ppolCook: what }, location.protocol === 'file:' ? '*' : location.origin); } catch (e) { /* no parent */ } }
  function opts(first) {
    var o = { opener: door, storeKey: 'ppolppol_cook_v0' }, v;
    if (embed) o.onClose = function () { tell('close'); };
    v = get('seed'); if (v !== null && /^\d{1,10}$/.test(v)) o.seed = Number(v);
    v = get('slow'); if (v !== null && +v > 0) o.slow = +v;
    if (get('reduced') === '1') o.reduced = true;
    if (get('rec') === '1') o.rec = true;
    v = get('recipe'); if (first && v) o.recipe = v;   /* straight into that dish, only on the first open */
    return o;
  }
  /* the same small link inside the kitchen dialog (cook.css never shows it; the style above shows it on the counter only) */
  function creditLink() {
    var d = document.getElementById('cook-dlg');
    if (!d || d.querySelector('.ckh-credits')) return;
    var a = document.createElement('a');
    a.className = 'ckh-credits'; a.href = 'credits.html?from=cook'; a.textContent = '만든 것들';
    d.appendChild(a);
  }
  function go(first) { try { var ok = !!(window.COOK && COOK.open && COOK.open(opts(first))); if (ok) creditLink(); return ok; } catch (e) { return false; } }
  /* sound: the game's js/audio.js, unless the page already has an AUDIO (the kitchen tests put a recording one in first) */
  function sound() {
    try {
      if (window.AUDIO && AUDIO.init) AUDIO.init({ on: get('sound') === '1' || undefined, warm: false });
    } catch (e) { /* sound is a bonus */ }
  }
  if (!window.AUDIO) {
    var s = document.createElement('script');
    s.src = 'js/audio.js'; s.onload = sound;
    document.head.appendChild(s);
  }
  door.addEventListener('click', function () { go(false); });
  if (embed) {
    window.addEventListener('message', function (e) {
      if (e.source !== window.parent || (e.origin !== 'null' && e.origin !== location.origin)) return;
      var d = e.data; if (!d || typeof d !== 'object') return;
      if (d.ppolCook === 'open') go(false);
      else if (d.ppolCook === 'close' && window.COOK && COOK.isOpen && COOK.isOpen()) COOK.close();
    });
  }
  go(true);
  if (embed) tell('ready');
})();
</script>
</body>
</html>
